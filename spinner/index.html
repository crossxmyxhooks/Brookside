<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Brookside Play Spinner</title>

<style>
  :root {
    --pink: #ff67b3;
    --hotpink: #ff3b9d;
    --lime: #c7ff55;
    --purple: #9d72ff;
    --orange: #ff9a3c;
    --aqua: #75e6e6;

    --ink: #34254c;
    --screen: #efffc9;
    --screen-dark: #263b28;
    --case: #d7c4ff;
    --case-dark: #a486df;

    --white: #fffdf7;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    min-height: 100vh;
    padding: 18px;
    font-family: "Trebuchet MS", Arial, sans-serif;
    color: var(--ink);

    background:
      radial-gradient(circle at 15px 15px, rgba(255,255,255,.55) 2px, transparent 3px)
      0 0 / 30px 30px,
      linear-gradient(135deg, #ffb4dc, #d9c8ff 50%, #baf3e4);
  }

  button {
    font: inherit;
  }

  .app {
    width: min(100%, 570px);
    margin: 0 auto;
  }

  /* handheld shell */

  .toy {
    position: relative;
    padding: 22px 18px 24px;

    border: 4px solid #755ba2;
    border-radius: 38px;

    background:
      linear-gradient(
        145deg,
        rgba(255,255,255,.5),
        transparent 25%
      ),
      var(--case);

    box-shadow:
      inset 5px 5px rgba(255,255,255,.45),
      inset -6px -7px rgba(82,55,127,.18),
      0 8px 0 #6a518c,
      0 14px 22px rgba(54,35,89,.25);
  }

  .screw {
    position: absolute;
    width: 13px;
    height: 13px;
    border-radius: 50%;
    background: #8d76b6;
    border: 2px solid #6b568d;
  }

  .screw::after {
    content: "";
    position: absolute;
    left: 2px;
    right: 2px;
    top: 4px;
    height: 2px;
    background: #604f7d;
    transform: rotate(-20deg);
  }

  .s1 { top: 17px; left: 18px; }
  .s2 { top: 17px; right: 18px; }
  .s3 { bottom: 19px; left: 18px; }
  .s4 { bottom: 19px; right: 18px; }

  .brand {
    text-align: center;
    margin-bottom: 13px;
  }

  .brand-title {
    margin: 0;
    font-size: clamp(25px, 7vw, 38px);
    line-height: 1;
    letter-spacing: -1px;

    text-shadow:
      2px 2px 0 #fff,
      4px 4px 0 rgba(116,80,158,.25);
  }

  .brand-sub {
    margin: 7px 0 0;
    font-size: 12px;
    font-weight: 900;
    letter-spacing: 2px;
    text-transform: uppercase;
  }

  .decor {
    letter-spacing: 5px;
    color: var(--hotpink);
  }

  /* fake LCD */

  .lcd-frame {
    border: 5px solid #755f97;
    border-radius: 23px;
    padding: 10px;

    background: #9278b4;

    box-shadow:
      inset 0 4px rgba(44,31,67,.35),
      0 3px rgba(255,255,255,.45);
  }

  .lcd {
    min-height: 415px;
    padding: 17px 14px;

    border-radius: 14px;

    color: var(--screen-dark);

    background:
      linear-gradient(
        rgba(50,90,50,.04) 1px,
        transparent 1px
      ) 0 0 / 100% 4px,
      var(--screen);

    box-shadow: inset 0 0 14px rgba(43,68,40,.25);
  }

  .status {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;

    margin-bottom: 15px;
    padding-bottom: 8px;

    border-bottom: 2px dashed rgba(38,59,40,.35);

    font-family: "Courier New", monospace;
    font-size: 11px;
    font-weight: 900;
  }

  .battery {
    display: inline-flex;
    align-items: center;
    gap: 2px;
  }

  .battery-box {
    display: inline-flex;
    gap: 2px;
    padding: 2px;
    border: 2px solid currentColor;
  }

  .battery-box i {
    display: block;
    width: 4px;
    height: 7px;
    background: currentColor;
  }

  /* menu */

  .menu {
    display: grid;
    gap: 11px;
  }

  .menu-button {
    min-height: 58px;
    width: 100%;

    border: 3px solid var(--ink);
    border-radius: 17px;

    color: var(--ink);
    font-weight: 1000;
    font-size: 17px;
    letter-spacing: .4px;

    box-shadow: 0 5px 0 var(--ink);

    cursor: pointer;
  }

  .menu-button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--ink);
  }

  .pink { background: var(--pink); }
  .lime { background: var(--lime); }
  .orange { background: var(--orange); }
  .aqua { background: var(--aqua); }

  .visit-button {
    margin-top: 16px;
    background: var(--purple);
    color: white;
    text-shadow: 1px 1px #5b3d8e;
  }

  /* screens */

  .screen {
    display: none;
  }

  .screen.active {
    display: block;
  }

  .screen-heading {
    margin: 3px 0 13px;
    text-align: center;
    font-size: 22px;
  }

  .back {
    border: 0;
    background: transparent;
    color: var(--screen-dark);
    font-weight: 900;
    cursor: pointer;
    padding: 5px;
    margin-bottom: 4px;
  }

  /* wheels */

  .wheel-area {
    display: grid;
    place-items: center;
    position: relative;
    margin: 8px auto 14px;
    width: min(315px, 88vw);
    aspect-ratio: 1;
  }

  .pointer {
    position: absolute;
    z-index: 5;
    top: -5px;

    width: 0;
    height: 0;

    border-left: 15px solid transparent;
    border-right: 15px solid transparent;
    border-top: 31px solid var(--hotpink);

    filter: drop-shadow(0 2px 0 var(--ink));
  }

  .wheel {
    width: 100%;
    height: 100%;
    border-radius: 50%;

    border: 6px solid var(--ink);

    box-shadow:
      inset 0 0 0 4px white,
      0 6px 0 rgba(52,37,76,.2);

    transition:
      transform 3.8s cubic-bezier(.16,.72,.12,1);
  }

  .wheel-center {
    position: absolute;
    z-index: 3;

    width: 60px;
    height: 60px;

    display: grid;
    place-items: center;

    border-radius: 50%;
    border: 4px solid var(--ink);

    background: var(--white);

    font-size: 26px;
    font-weight: 1000;
  }

  .result {
    min-height: 57px;
    display: grid;
    place-items: center;

    margin: 12px 0;
    padding: 9px 12px;

    border: 3px dashed var(--screen-dark);
    border-radius: 12px;

    text-align: center;
    font-family: "Courier New", monospace;
    font-size: 19px;
    font-weight: 900;
  }

  .spin-button {
    width: 100%;
    min-height: 54px;

    border: 3px solid var(--ink);
    border-radius: 999px;

    background: var(--hotpink);
    color: white;

    font-weight: 1000;
    font-size: 18px;

    box-shadow: 0 5px 0 var(--ink);

    cursor: pointer;
  }

  .spin-button:active {
    transform: translateY(4px);
    box-shadow: 0 1px 0 var(--ink);
  }

  .spin-button:disabled {
    opacity: .55;
    cursor: wait;
  }

  /* dice */

  .dice-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
  }

  .die-button {
    min-height: 62px;

    border: 3px solid var(--ink);
    border-radius: 13px;

    background: var(--white);
    color: var(--ink);

    font-size: 18px;
    font-weight: 1000;

    box-shadow: 0 4px 0 var(--ink);
    cursor: pointer;
  }

  .die-button:nth-child(2n) {
    background: var(--pink);
  }

  .die-button:nth-child(3n) {
    background: var(--lime);
  }

  .die-button:active {
    transform: translateY(3px);
    box-shadow: 0 1px 0 var(--ink);
  }

  .die-display {
    width: 115px;
    height: 115px;

    display: grid;
    place-items: center;

    margin: 20px auto;

    border: 5px solid var(--ink);
    border-radius: 22px;

    background: white;

    font-family: "Courier New", monospace;
    font-size: 52px;
    font-weight: 1000;

    box-shadow: 6px 6px 0 var(--purple);
  }

  .rolling {
    animation: shake .12s linear infinite alternate;
  }

  @keyframes shake {
    from { transform: rotate(-7deg) translateX(-3px); }
    to { transform: rotate(7deg) translateX(3px); }
  }

  /* visit */

  .visit-card {
    border: 4px solid var(--screen-dark);
    border-radius: 16px;
    background: rgba(255,255,255,.45);
    padding: 16px;
    text-align: center;
  }

  .visit-small {
    margin: 5px 0;
    font-family: "Courier New", monospace;
    font-size: 12px;
    font-weight: bold;
  }

  .visit-big {
    margin: 6px 0 16px;
    font-size: 24px;
    font-weight: 1000;
  }

  .sparkles {
    font-size: 25px;
    letter-spacing: 7px;
  }

  /* history */

  .history-list {
    display: grid;
    gap: 8px;
    max-height: 270px;
    overflow-y: auto;
  }

  .history-item {
    padding: 8px 10px;
    border-bottom: 2px dashed rgba(38,59,40,.35);
    font-family: "Courier New", monospace;
    font-size: 12px;
    font-weight: bold;
  }

  .clear-history {
    margin-top: 14px;
    padding: 9px 13px;

    border: 2px solid var(--screen-dark);
    border-radius: 9px;

    background: transparent;

    font-weight: bold;
    cursor: pointer;
  }

  /* controls under device */

  .bottom-controls {
    display: flex;
    justify-content: center;
    gap: 14px;

    margin-top: 17px;
  }

  .round-control {
    width: 53px;
    height: 53px;

    display: grid;
    place-items: center;

    border-radius: 50%;
    border: 3px solid var(--ink);

    background: var(--orange);

    box-shadow: 0 4px 0 var(--ink);

    font-size: 20px;
    cursor: pointer;
  }

  .round-control:nth-child(2) {
    background: var(--lime);
  }

  .speaker {
    display: flex;
    justify-content: center;
    gap: 7px;

    margin-top: 20px;
  }

  .speaker span {
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: rgba(65,43,98,.45);
  }

  .toy-label {
    text-align: center;
    margin-top: 10px;
    font-size: 10px;
    font-weight: 900;
    letter-spacing: 2px;
    opacity: .65;
  }

  @media (max-width: 390px) {
    body {
      padding: 8px;
    }

    .toy {
      border-radius: 30px;
      padding-left: 11px;
      padding-right: 11px;
    }

    .lcd {
      padding-left: 10px;
      padding-right: 10px;
    }

    .dice-grid {
      grid-template-columns: repeat(2, 1fr);
    }
  }

  @media (prefers-reduced-motion: reduce) {
    .wheel {
      transition-duration: .01s;
    }

    .rolling {
      animation: none;
    }
  }
</style>
</head>

<body>

<main class="app">

  <section class="toy">

    <span class="screw s1"></span>
    <span class="screw s2"></span>
    <span class="screw s3"></span>
    <span class="screw s4"></span>

    <header class="brand">
      <h1 class="brand-title">
        Brookside
      </h1>

      <p class="brand-sub">
        <span class="decor">★</span>
        Play Pal
        <span class="decor">★</span>
      </p>
    </header>


    <div class="lcd-frame">
      <div class="lcd">

        <div class="status">
          <span>PLAY MODE</span>

          <span class="battery">
            BATT
            <span class="battery-box">
              <i></i><i></i><i></i>
            </span>
          </span>
        </div>


        <!-- HOME -->

        <section id="homeScreen" class="screen active">

          <div class="menu">

            <button
              class="menu-button pink"
              data-open="dollScreen"
              type="button"
            >
              💗 SPIN A DOLL
            </button>

            <button
              class="menu-button lime"
              data-open="locationScreen"
              type="button"
            >
              ★ SPIN A PLACE
            </button>

            <button
              class="menu-button orange"
              data-open="diceScreen"
              type="button"
            >
              🎲 ROLL DICE
            </button>

            <button
              class="menu-button aqua"
              data-open="historyScreen"
              type="button"
            >
              💾 MEMORY LOG
            </button>

          </div>


          <button
            id="visitButton"
            class="menu-button visit-button"
            type="button"
          >
            ✦ PLAY A VISIT ✦
          </button>

          <div class="result">
            SELECT PLAY MODE
          </div>

        </section>


        <!-- DOLL SPINNER -->

        <section id="dollScreen" class="screen">

          <button class="back" data-home type="button">
            ◀ HOME
          </button>

          <h2 class="screen-heading">
            WHO'S GOING?
          </h2>

          <div class="wheel-area">

            <div class="pointer"></div>

            <div
              id="dollWheel"
              class="wheel"
              aria-hidden="true"
            ></div>

            <div class="wheel-center">
              ♥
            </div>

          </div>

          <div
            id="dollResult"
            class="result"
            aria-live="polite"
          >
            PRESS SPIN
          </div>

          <button
            id="spinDoll"
            class="spin-button"
            type="button"
          >
            SPIN! ★
          </button>

        </section>


        <!-- LOCATION SPINNER -->

        <section id="locationScreen" class="screen">

          <button class="back" data-home type="button">
            ◀ HOME
          </button>

          <h2 class="screen-heading">
            WHERE TO?
          </h2>

          <div class="wheel-area">

            <div class="pointer"></div>

            <div
              id="locationWheel"
              class="wheel"
              aria-hidden="true"
            ></div>

            <div class="wheel-center">
              ★
            </div>

          </div>

          <div
            id="locationResult"
            class="result"
            aria-live="polite"
          >
            PRESS SPIN
          </div>

          <button
            id="spinLocation"
            class="spin-button"
            type="button"
          >
            SPIN! ★
          </button>

        </section>


        <!-- DICE -->

        <section id="diceScreen" class="screen">

          <button class="back" data-home type="button">
            ◀ HOME
          </button>

          <h2 class="screen-heading">
            DICE TRAY
          </h2>

          <div
            id="dieDisplay"
            class="die-display"
            aria-live="polite"
          >
            ?
          </div>

          <div class="dice-grid">

            <button class="die-button" data-die="4" type="button">
              D4
            </button>

            <button class="die-button" data-die="6" type="button">
              D6
            </button>

            <button class="die-button" data-die="8" type="button">
              D8
            </button>

            <button class="die-button" data-die="10" type="button">
              D10
            </button>

            <button class="die-button" data-die="12" type="button">
              D12
            </button>

            <button class="die-button" data-die="20" type="button">
              D20
            </button>

          </div>

          <div
            id="diceResult"
            class="result"
          >
            CHOOSE A DIE
          </div>

        </section>


        <!-- VISIT RESULT -->

        <section id="visitScreen" class="screen">

          <button class="back" data-home type="button">
            ◀ HOME
          </button>

          <h2 class="screen-heading">
            TODAY IN BROOKSIDE
          </h2>

          <div class="visit-card">

            <div class="sparkles">
              ★ ✿ ★
            </div>

            <p class="visit-small">
              TODAY YOU ARE
            </p>

            <div
              id="visitDoll"
              class="visit-big"
            ></div>

            <p class="visit-small">
              HEADED TO
            </p>

            <div
              id="visitLocation"
              class="visit-big"
            ></div>

            <div class="sparkles">
              ✿ ★ ✿
            </div>

          </div>

          <button
            id="rerollVisit"
            class="spin-button"
            style="margin-top:16px;"
            type="button"
          >
            NEW ADVENTURE!
          </button>

        </section>


        <!-- HISTORY -->

        <section id="historyScreen" class="screen">

          <button class="back" data-home type="button">
            ◀ HOME
          </button>

          <h2 class="screen-heading">
            MEMORY LOG
          </h2>

          <div
            id="historyList"
            class="history-list"
          ></div>

          <button
            id="clearHistory"
            class="clear-history"
            type="button"
          >
            CLEAR MEMORY
          </button>

        </section>

      </div>
    </div>


    <div class="bottom-controls">

      <button
        id="homeButton"
        class="round-control"
        aria-label="Home"
        type="button"
      >
        ♥
      </button>

      <button
        id="randomButton"
        class="round-control"
        aria-label="Play a random visit"
        type="button"
      >
        ★
      </button>

    </div>


    <div class="speaker" aria-hidden="true">
      <span></span>
      <span></span>
      <span></span>
      <span></span>
      <span></span>
    </div>

    <div class="toy-label">
      BROOKSIDE ELECTRONIC PLAY PAL • 2003-ish
    </div>

  </section>

</main>


<script>
(() => {

  /* ================================
     YOUR BROOKSIDE CONTENT
     ================================ */

  const dolls = [
    "Lucy Bennet",
    "Clara June Bennet",
    "Lea Grace",
    "Delilah",
    "Winnie Brooks",
    "Bonnie Bea",
    "Clarissa",
    "Hart Chapman",
    "Brittney Paige",
    "Piper McKay",
    "Nevaeh",
    "Talia",
    "Maisie O'Connor",
    "Kennley Ann",
    "Briar Jensen",
    "Hallie Jo",
    "Addy Walker"
  ];


  const locations = [
  "Paws Coffee",
  "Brookside Thrift",
  "Brookside Library"
  ];


  /* ================================
     COLORS
     ================================ */

  const wheelColors = [
    "#ff67b3",
    "#c7ff55",
    "#9d72ff",
    "#ff9a3c",
    "#75e6e6",
    "#ffd967"
  ];


  /* ================================
     RANDOMNESS
     ================================ */

  /*
    Uses crypto.getRandomValues instead
    of Math.random.

    Rejection sampling avoids modulo bias.
  */

  function secureRandomInt(max) {

    if (
      !Number.isInteger(max) ||
      max <= 0
    ) {
      throw new Error("max must be a positive integer");
    }

    const maxUint = 0x100000000;
    const limit =
      maxUint -
      (maxUint % max);

    const values =
      new Uint32Array(1);

    let value;

    do {
      crypto.getRandomValues(values);
      value = values[0];
    }
    while (value >= limit);

    return value % max;
  }


  function randomFrom(array) {
    return array[
      secureRandomInt(array.length)
    ];
  }


  /* ================================
     SCREEN NAVIGATION
     ================================ */

  const screens =
    document.querySelectorAll(".screen");

  function showScreen(id) {

    screens.forEach(screen => {
      screen.classList.remove("active");
    });

    const target =
      document.getElementById(id);

    if (target) {
      target.classList.add("active");
    }

    if (id === "historyScreen") {
      renderHistory();
    }
  }


  document
    .querySelectorAll("[data-open]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {
          showScreen(button.dataset.open);
        }
      );

    });


  document
    .querySelectorAll("[data-home]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {
          showScreen("homeScreen");
        }
      );

    });


  document
    .getElementById("homeButton")
    .addEventListener(
      "click",
      () => showScreen("homeScreen")
    );


  /* ================================
     BUILD WHEELS
     ================================ */

  function makeGradient(count) {

    const slice =
      360 / count;

    const sections = [];

    for (
      let i = 0;
      i < count;
      i++
    ) {

      const start =
        i * slice;

      const end =
        start + slice;

      const color =
        wheelColors[
          i % wheelColors.length
        ];

      sections.push(
        `${color} ${start}deg ${end}deg`
      );
    }

    return `conic-gradient(${sections.join(",")})`;
  }


  const dollWheel =
    document.getElementById("dollWheel");

  const locationWheel =
    document.getElementById("locationWheel");


  dollWheel.style.background =
    makeGradient(dolls.length);

  locationWheel.style.background =
    makeGradient(locations.length);


  let dollRotation = 0;
  let locationRotation = 0;


  function animateWheel(
    wheel,
    items,
    selectedIndex,
    currentRotation
  ) {

    const slice =
      360 / items.length;

    /*
      Center of selected wedge.
    */

    const selectedCenter =
      selectedIndex * slice +
      slice / 2;

    /*
      Wheel pointer sits at 12 o'clock.

      Add several full rotations
      before landing.
    */

    const extraSpins =
      5 + secureRandomInt(4);

    const normalized =
      ((currentRotation % 360) + 360)
      % 360;

    const desired =
      360 - selectedCenter;

    let delta =
      desired - normalized;

    if (delta < 0) {
      delta += 360;
    }

    const newRotation =
      currentRotation +
      extraSpins * 360 +
      delta;

    wheel.style.transform =
      `rotate(${newRotation}deg)`;

    return newRotation;
  }


  /* ================================
     DOLL SPINNER
     ================================ */

  const spinDoll =
    document.getElementById("spinDoll");

  const dollResult =
    document.getElementById("dollResult");


  spinDoll.addEventListener(
    "click",
    () => {

      const index =
        secureRandomInt(dolls.length);

      const result =
        dolls[index];

      spinDoll.disabled = true;

      dollResult.textContent =
        "SPINNING...";

      dollRotation =
        animateWheel(
          dollWheel,
          dolls,
          index,
          dollRotation
        );


      window.setTimeout(
        () => {

          dollResult.textContent =
            `★ ${result} ★`;

          spinDoll.disabled = false;

          addHistory(
            `DOLL → ${result}`
          );

        },
        3900
      );

    }
  );


  /* ================================
     LOCATION SPINNER
     ================================ */

  const spinLocation =
    document.getElementById(
      "spinLocation"
    );

  const locationResult =
    document.getElementById(
      "locationResult"
    );


  spinLocation.addEventListener(
    "click",
    () => {

      const index =
        secureRandomInt(
          locations.length
        );

      const result =
        locations[index];

      spinLocation.disabled = true;

      locationResult.textContent =
        "SPINNING...";

      locationRotation =
        animateWheel(
          locationWheel,
          locations,
          index,
          locationRotation
        );


      window.setTimeout(
        () => {

          locationResult.textContent =
            `★ ${result} ★`;

          spinLocation.disabled = false;

          addHistory(
            `PLACE → ${result}`
          );

        },
        3900
      );

    }
  );


  /* ================================
     DICE
     ================================ */

  const dieDisplay =
    document.getElementById(
      "dieDisplay"
    );

  const diceResult =
    document.getElementById(
      "diceResult"
    );


  document
    .querySelectorAll("[data-die]")
    .forEach(button => {

      button.addEventListener(
        "click",
        () => {

          const sides =
            Number(
              button.dataset.die
            );

          dieDisplay.classList.add(
            "rolling"
          );

          diceResult.textContent =
            `ROLLING D${sides}...`;


          let animationCount = 0;

          const animation =
            window.setInterval(
              () => {

                dieDisplay.textContent =
                  secureRandomInt(sides)
                  + 1;

                animationCount++;

                if (
                  animationCount >= 10
                ) {

                  window.clearInterval(
                    animation
                  );

                  const finalResult =
                    secureRandomInt(
                      sides
                    ) + 1;

                  dieDisplay.classList
                    .remove("rolling");

                  dieDisplay.textContent =
                    finalResult;

                  diceResult.textContent =
                    `D${sides} → ${finalResult}`;

                  addHistory(
                    `D${sides} → ${finalResult}`
                  );
                }

              },
              70
            );

        }
      );

    });


  /* ================================
     PLAY A VISIT
     ================================ */

  const visitDoll =
    document.getElementById(
      "visitDoll"
    );

  const visitLocation =
    document.getElementById(
      "visitLocation"
    );


  function createVisit() {

    const doll =
      randomFrom(dolls);

    const location =
      randomFrom(locations);

    visitDoll.textContent =
      doll;

    visitLocation.textContent =
      location;

    addHistory(
      `VISIT → ${doll} @ ${location}`
    );

    showScreen(
      "visitScreen"
    );
  }


  document
    .getElementById("visitButton")
    .addEventListener(
      "click",
      createVisit
    );


  document
    .getElementById("rerollVisit")
    .addEventListener(
      "click",
      createVisit
    );


  document
    .getElementById("randomButton")
    .addEventListener(
      "click",
      createVisit
    );


  /* ================================
     HISTORY
     ================================ */

  const HISTORY_KEY =
    "brookside-play-pal-history";


  function getHistory() {

    try {

      const saved =
        localStorage.getItem(
          HISTORY_KEY
        );

      return saved
        ? JSON.parse(saved)
        : [];

    }
    catch {
      return [];
    }
  }


  function saveHistory(history) {

    try {

      localStorage.setItem(
        HISTORY_KEY,
        JSON.stringify(history)
      );

    }
    catch {
      /* app still works */
    }
  }


  function addHistory(text) {

    const history =
      getHistory();

    history.unshift({
      text,
      time:
        new Date()
          .toLocaleString()
    });

    /*
      Don't let the history
      grow forever.
    */

    if (
      history.length > 50
    ) {
      history.length = 50;
    }

    saveHistory(history);
  }


  function renderHistory() {

    const container =
      document.getElementById(
        "historyList"
      );

    const history =
      getHistory();

    container.innerHTML = "";

    if (
      history.length === 0
    ) {

      container.innerHTML =
        `<div class="result">
          NO MEMORIES YET
        </div>`;

      return;
    }


    history.forEach(item => {

      const div =
        document.createElement(
          "div"
        );

      div.className =
        "history-item";

      const result =
        document.createElement(
          "div"
        );

      result.textContent =
        item.text;

      const time =
        document.createElement(
          "small"
        );

      time.textContent =
        item.time;

      div.appendChild(
        result
      );

      div.appendChild(
        time
      );

      container.appendChild(
        div
      );

    });
  }


  document
    .getElementById("clearHistory")
    .addEventListener(
      "click",
      () => {

        try {
          localStorage.removeItem(
            HISTORY_KEY
          );
        }
        catch {
          /* ignore */
        }

        renderHistory();
      }
    );

})();
</script>

</body>
</html>
